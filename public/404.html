<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HS Web Studio</title>
  <script>
    // Single Page Apps for GitHub Pages & Custom Domains
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current url and redirects to the base URL with the path and query string as a query param
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
